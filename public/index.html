<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Hyreo Account Management System — accounts, MSA contracts, change request lifecycle, approvals, documents and e-signature." />
  <meta name="theme-color" content="#14264a" />
  <title>Hyreo Account Management</title>
  <link rel="icon" href="https://hyreo.com/wp-content/uploads/2023/12/cropped-hyreo-logo2-32x32.png" sizes="32x32" />
  <link rel="icon" href="https://hyreo.com/wp-content/uploads/2023/12/cropped-hyreo-logo2-192x192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="https://hyreo.com/wp-content/uploads/2023/12/cropped-hyreo-logo2-180x180.png" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <!-- Recolours the hosted Hyreo logo for navy surfaces: navy ink -> white, cyan "eo" kept. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="hyreo-logo-on-dark" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 -1.392 0 0 1.224  0 -0.347 0 0 1.056  0 -0.069 0 0 1.011  0 0 0 1 0" />
    </filter>
  </svg>
  <div id="app">
    <noscript>
      <div style="padding:40px;font-family:sans-serif">
        The Hyreo Account Management System requires JavaScript to be enabled.
      </div>
    </noscript>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
